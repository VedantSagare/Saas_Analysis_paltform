# Application
spring.application.name=saas-analytics-backend
server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/saas_analytics
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=saas-analytics-group
spring.kafka.consumer.auto-offset-reset=earliest

# Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379

# Security
jwt.secret=hsfjsdjsdjjfjjak
jwt.expiration-ms=86400000
jwt.refresh-expiration-ms=604800000

# Event ingestion
app.events.topic=events
app.events.dead-letter-topic=events-dlq
app.events.retry.max-attempts=5
app.events.retry.backoff-ms=2000

# Analytics / warehouse
app.analytics.url=jdbc:clickhouse://localhost:8123/default
app.analytics.username=default
app.analytics.password=
app.analytics.database=default

# Actuator / Prometheus
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.prometheus.metrics.export.enabled=true

# Logging
logging.level.org.springframework=INFO
logging.level.com.example=INFO
